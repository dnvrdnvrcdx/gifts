<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ♡</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bouquet-page">
  <div class="stars" aria-hidden="true"></div>
  <main class="garden">
    <p class="message-top">For the prettiest person in my world ♡</p>
    <h1>Flowers, just for you.</h1>
    <p class="message">Pink tulips, blue tulips, and roses — a tiny digital bouquet because you deserve something pretty.</p>

    <section class="bouquet" aria-label="A bouquet of flowers">
      <div class="flower pink-tulip flower-a"><div class="petals"><i></i><i></i><i></i><i></i></div><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div></div>
      <div class="flower blue-tulip flower-b"><div class="petals"><i></i><i></i><i></i><i></i></div><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div></div>
      <div class="flower rose flower-c"><div class="rose-head"><span></span><b></b><i></i></div><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div></div>
      <div class="flower blue-tulip flower-d"><div class="petals"><i></i><i></i><i></i><i></i></div><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div></div>
      <div class="flower pink-tulip flower-e"><div class="petals"><i></i><i></i><i></i><i></i></div><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div></div>
      <div class="flower rose flower-f"><div class="rose-head"><span></span><b></b><i></i></div><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div></div>
      <div class="wrap"></div>
    </section>

    <p class="final-note">No matter how many flowers I give you, they still wouldn't be enough. ♡</p>
    <button class="back-btn" onclick="location.href='index.html'">↩ back to the note</button>
  </main>
</body>
</html>
